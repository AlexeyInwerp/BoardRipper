<style>

#app { display:grid; grid-template-rows:40px 1fr; height:100%; }
header { display:flex; align-items:center; gap:4px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1 { font-size:13px; font-weight:600; margin:0 16px 0 0; color:var(--muted); }
.tab { background:none; border:1px solid transparent; color:var(--muted); padding:5px 12px; border-radius:6px; cursor:pointer; font:inherit; }

.tagl { left:8px; } .tagr { right:8px; }

.seg button.on { color:#111; background:var(--accent); border-color:var(--accent); }

<div id="app">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const D = window.BOARD3D;
if (!D) { document.getElementById('view').innerHTML = '<div class="err">No board data. Run <code>cd src/frontend &amp;&amp; npx vite-node ../../scripts/board-3d-export.ts -- ../../samples/3d-compare/rp2040.brd ../../samples/3d-compare/feather-rp2040.js</code> (board and photos: see the design doc).</div>'; throw new Error('no data'); }
const $ = s => document.querySelector(s);
const MM = 0.0254, T = 1.6, TOP = T / 2;
// outline bounds (mils) and the scene frame: mm, centred, z = −y
const contours = []; { let cur = []; for (const p of D.outline) { if (!p) { if (cur.length) contours.push(cur); cur = []; } else cur.push(p); } if (cur.length) contours.push(cur); }
const ob = contours.flat().reduce((b, [x, y]) => ({ x0: Math.min(b.x0, x), x1: Math.max(b.x1, x), y0: Math.min(b.y0, y), y1: Math.max(b.y1, y) }), { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 });
const CX = (ob.x0 + ob.x1) / 2 * MM, CY = (ob.y0 + ob.y1) / 2 * MM;
const X = x => x * MM - CX, Z = y => -(y * MM - CY);

// ───────────── renderer ─────────────
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(-30, 80, 40); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -110, right: 110, top: 60, bottom: -60, far: 300 }); key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.radius = 4;
const under = new THREE.DirectionalLight(0xffffff, 1.3); under.position.set(-30, -80, 40); // lights the bottom side for bottom views

const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x47484b, roughness: 0.9 }));
backdrop.rotation.x = -Math.PI / 2; backdrop.position.y = -T / 2 - 0.02; backdrop.receiveShadow = true; scene.add(backdrop);

// ───────────── board textures (mask + copper-under-mask + pads + silk) ─────────────
const PPM = Math.min(40, 8000 / Math.max(Wmm, Hmm)); // px per mm, texture ≤ 8000 px
function boardTexture(side, opts) {

  const c = cv.getContext('2d'); const U = x => (x - ob.x0) * MM * PPM, V = y => (ob.y1 - y) * MM * PPM, S = m => m * MM * PPM;
  c.fillStyle = '#0e0f11'; c.fillRect(0, 0, cv.width, cv.height);

  if (opts.cu) {
    c.strokeStyle = '#1d1f23'; c.lineCap = 'round';
    for (const [x1, y1, x2, y2, w, L] of D.traces) if (L === layer) { c.lineWidth = S(w); c.beginPath(); c.moveTo(U(x1), V(y1)); c.lineTo(U(x2), V(y2)); c.stroke(); }
    c.fillStyle = '#202227'; for (const [x, y, d] of D.vias) { c.beginPath(); c.arc(U(x), V(y), S(d) * 0.9 + 3, 0, 7); c.fill(); }
  }
  // exposed copper: ENIG gold
  c.fillStyle = '#c99a3c';
  for (const p of D.pads) {
    if (p.side !== side && p.side !== 'both') continue;
    const [x0, y0, x1, y1] = p.b; const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    c.save(); c.translate(U(cx), V(cy));
    if (p.shape === 'round' || p.drill) { const r = S(Math.max(x1 - x0, y1 - y0)) / 2; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); }
    else if (p.w && p.h) { c.rotate(-(p.a || 0) * Math.PI / 180); c.fillRect(-S(p.w) / 2, -S(p.h) / 2, S(p.w), S(p.h)); }

  }

    for (const t of D.texts) if (t.side === side && t.text) {

      c.font = `600 ${S(t.size) * 1.25}px "Helvetica Neue", Arial, sans-serif`; c.textAlign = t.align.includes('center') ? 'center' : 'left'; c.textBaseline = t.align.includes('center') ? 'middle' : 'alphabetic'; c.fillText(t.text, 0, 0); c.restore();
    }

  const x0 = ob.x0 * MM - CX, y0 = ob.y0 * MM - CY;
  tex.repeat.set(1 / Wmm, 1 / Hmm); tex.offset.set(-x0 / Wmm, -y0 / Hmm);

}
const MOUNT = D.parts.map(p => p.est.pins.family === 'hole' || p.est.pkg.family === 'hole' ? (p.est.pkg.family === 'hole' ? p.est.pkg : p.est.pins) : null).filter(Boolean);
// board shape with every drill as a hole
function boardShape() {
  const s = new THREE.Shape(); contours[0].forEach(([x, y], i) => (i ? s.lineTo(X(x), y * MM - CY) : s.moveTo(X(x), y * MM - CY)));

  for (const e of MOUNT) if (!D.pads.some(p => p.drill && Math.abs((p.b[0] + p.b[2]) / 2 - e.cx) < 5 && Math.abs((p.b[1] + p.b[3]) / 2 - e.cy) < 5)) { const h = new THREE.Path(); h.absellipse(X(e.cx), e.cy * MM - CY, e.L * 0.28, e.W * 0.28, 0, Math.PI * 2, true); s.holes.push(h); }

}
const shape = boardShape();
const slabGeo = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false, curveSegments: 32 }); slabGeo.rotateX(-Math.PI / 2); slabGeo.translate(0, -T / 2, 0);
const slab = new THREE.Mesh(slabGeo, [new THREE.MeshStandardMaterial({ color: 0x141518, roughness: 0.4 }), new THREE.MeshStandardMaterial({ color: 0x8a7d5c, roughness: 0.85 })]);
slab.castShadow = slab.receiveShadow = true; scene.add(slab);
const faceGeo = new THREE.ShapeGeometry(shape, 32); faceGeo.rotateX(-Math.PI / 2);
const topMat = new THREE.MeshPhysicalMaterial({ roughness: 0.45, clearcoat: 0.35, clearcoatRoughness: 0.45, polygonOffset: true, polygonOffsetFactor: -1 });
const botMat = topMat.clone(); botMat.side = THREE.BackSide;
const topFace = new THREE.Mesh(faceGeo, topMat); topFace.position.y = TOP + 0.002; topFace.receiveShadow = true; scene.add(topFace);
const botFace = new THREE.Mesh(faceGeo, botMat); botFace.position.y = -TOP - 0.002; scene.add(botFace);
// plated hole barrels
const barrelMat = new THREE.MeshStandardMaterial({ color: 0xd8b25c, metalness: 1, roughness: 0.3, side: THREE.DoubleSide });
for (const p of D.pads.filter(p => p.drill)) { const r = p.drill * MM / 2; const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, T, 24, 1, true), barrelMat); m.position.set(X((p.b[0] + p.b[2]) / 2), 0, Z((p.b[1] + p.b[3]) / 2)); scene.add(m); }
function refreshTextures() {
  const o = { cu: $('#cu').checked, silk: $('#silk').checked };
  for (const [m, s] of [[topMat, 'top'], [botMat, 'bottom']]) { m.map?.dispose(); m.map = boardTexture(s, o); m.needsUpdate = true; }
}

// ───────────── materials & primitives ─────────────
const M = {
  tin: new THREE.MeshStandardMaterial({ color: 0xd9dde2, metalness: 1, roughness: 0.28 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xe3b95c, metalness: 1, roughness: 0.3 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xeeeee6, roughness: 0.7 }),
  resTop: new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.55 }),
  mlcc: new THREE.MeshStandardMaterial({ color: 0x9c7f5c, roughness: 0.75 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2b2b2d, roughness: 0.6 }),
  epoxy: new THREE.MeshStandardMaterial({ color: 0x1d1d20, roughness: 0.45 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc8ccd2, metalness: 0.95, roughness: 0.3 }),
  ledBody: new THREE.MeshStandardMaterial({ color: 0xf4f4ee, roughness: 0.55 }),
  band: new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.5 }),
  dot: new THREE.MeshStandardMaterial({ color: 0x55565a, roughness: 0.4 }),
  nylon: new THREE.MeshStandardMaterial({ color: 0xe8dfc8, roughness: 0.65 }),
  slot: new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.9 }),
  ghost: new THREE.MeshStandardMaterial({ color: 0x8a9099, roughness: 0.8, transparent: true, opacity: 0.55 }),
  lens: c => (M._lens[c] ??= new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.1, transmission: 0.3, transparent: true, opacity: 0.85, emissive: c, emissiveIntensity: 0.15 })), _lens: {},
  polymer: new THREE.MeshStandardMaterial({ color: 0x17171a, roughness: 0.5 }),
  ferrite: new THREE.MeshStandardMaterial({ color: 0x5b5d61, roughness: 0.7, metalness: 0.2 }),
  lid: new THREE.MeshStandardMaterial({ color: 0xc9ccd1, metalness: 0.9, roughness: 0.38 }),
  subst: new THREE.MeshStandardMaterial({ color: 0x2f3d2a, roughness: 0.6 }),
  print: new THREE.MeshStandardMaterial({ color: 0xd9d9d2, roughness: 0.6 }),

const GC = new Map(); const geo = (k, f) => GC.get(k) ?? GC.set(k, f()).get(k);
const box = (w, h, d, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo(`b${w.toFixed(3)},${h.toFixed(3)},${d.toFixed(3)}`, () => new THREE.BoxGeometry(w, h, d)), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };
const rbox = (w, h, d, r, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo(`r${w.toFixed(3)},${h.toFixed(3)},${d.toFixed(3)},${r.toFixed(3)}`, () => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2) * 0.99)), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };
const cyl = (r, h, mat, x = 0, y = 0, z = 0, seg = 28) => { const m = new THREE.Mesh(geo(`c${r.toFixed(3)},${h.toFixed(3)},${seg}`, () => new THREE.CylinderGeometry(r, r, h, seg)), mat); m.position.set(x, y, z); m.castShadow = true; return m; };
function gull(g, x, side, half, out, hy, w, axis = 'z') {
  const t = 0.13, k1 = out * 0.35, k2 = out * 0.55;

// ───────────── model per estimate (local frame: X = body X, −Z = board +y) ─────────────
const ledColor = v => /RED/i.test(v) ? 0xff3a2a : /ORANGE|AMBER/i.test(v) ? 0xff9a2a : /GREEN/i.test(v) ? 0x3aff6a : /BLUE/i.test(v) ? 0x3a7aff : /YEL/i.test(v) ? 0xffe03a : 0xf2f2e8;
function buildModel(e, part, mode) {
  const g = new THREE.Group(); const { L, W, H, p } = e;
  switch (e.family) {
    case 'chip': {
      const k = e.kind;
      if (k === 'R') { g.add(box(L * 0.96, H * 0.82, W, M.ceramic, 0, H * 0.41)); g.add(box(L * 0.62, H * 0.12, W * 0.92, M.resTop, 0, H * 0.88)); for (const s of [-1, 1]) g.add(box(L * 0.2, H, W * 1.02, M.tin, s * (L / 2 - L * 0.1), H / 2)); }
      else if (k === 'LED') { g.add(box(L * 0.96, H * 0.55, W, M.ledBody, 0, H * 0.275)); g.add(box(L * 0.7, H * 0.45, W * 0.8, M.lens(mode === 'pkg' ? ledColor(part.value) : 0xf2f2e8), 0, H * 0.775)); for (const s of [-1, 1]) g.add(box(L * 0.16, H * 0.55, W * 1.02, M.tin, s * (L / 2 - L * 0.08), H * 0.275)); }
      else { const mat = k === 'C' ? M.mlcc : k === 'L' || k === 'FB' ? M.dark : k === 'D' ? M.epoxy : M.dot; const r = Math.min(W, H) * 0.12; g.add(rbox(L * 0.98, H, W, r, mat, 0, H / 2)); for (const s of [-1, 1]) g.add(rbox(L * 0.24, H * 1.02, W * 1.02, r, M.tin, s * (L / 2 - L * 0.12), H / 2)); if (k === 'D') g.add(box(L * 0.12, 0.01, W, M.band, -L * 0.28, H + 0.005)); }
      break;
    }
