<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

         gets a page screenshot. Installing is also what exempts the site from
         Safari's 7-day storage eviction, so the install path must look real. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BoardRipper" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BoardRipper</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
