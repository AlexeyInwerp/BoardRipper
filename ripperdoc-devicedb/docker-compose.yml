# Local prototype compose for ripperdoc-devicedb.
#
# `docker compose up` brings the service up on host port 8090 with the
# bundled BoardRipper boards.db mounted read-only at /seed so the canonical
# SQLite is auto-seeded on first boot. Subsequent boots are no-ops on the
# seed step (seed_state.seeded=1 in the local DB).
#
# A `boardripper` service is sketched below (commented) — wiring is owned
# by a later agent.

services:
  devicedb:
    build:
      context: .
      args:
        APP_VERSION: dev
    image: ripperdoc/devicedb:dev
    container_name: ripperdoc-devicedb
    ports:
      - "8090:8090"
    environment:
      LISTEN_ADDR: ":8090"
      DATA_DIR: "/data"
      SEED_DB_PATH: "/seed/boards.db"
      WEB_DIR: "/app/web"
      CORS_ALLOWED_ORIGINS: "*"
      SNAPSHOT_TARBALL_BASE_URL: "http://localhost:8090/v1/snapshots"
      # Mount a 64-byte Ed25519 private key here in production:
      # SNAPSHOT_PRIVATE_KEY_PATH: "/run/secrets/snapshot.key"
    volumes:
      - ./data:/data
      - ../Board Database:/seed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Bring up BoardRipper alongside devicedb for full-stack manual testing.
  # Build context is the parent directory (the existing BoardRipper Dockerfile).
  # Default port 8081 (host) → 8080 (container) matches the project's
  # top-level docker-compose.yml. Run:
  #   docker compose -f docker-compose.yml --profile fullstack up --build
  # Without the `--profile fullstack` flag only the devicedb service comes up.
  boardripper:
    build:
      context: ..
      dockerfile: Dockerfile
    image: boardripper/local:dev
    container_name: boardripper-vs-devicedb
    user: "0:0"                # match the project's compose convention
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      LIBRARY_DIR: "/library"
      CONTRIBDB_ENABLED: "true"
      DEVICEDB_BASE_URL: "http://devicedb:8090"
    volumes:
      - ./br-data:/data
      - ./br-library:/library
    depends_on:
      devicedb:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["fullstack"]
